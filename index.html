<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nakoda MIS</title>
<meta name="theme-color" content="#DA1017">
<link rel="icon" href="icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<!-- v459d: the frame is "credentialless" (no Google cookies → no multi-account error); the MIS login is kept here.
     v459c: the MIS runs on Apps Script. This GitHub page now SHOWS the Apps Script MIS inside itself, so the
     old MIS icon on every phone keeps working — nobody has to remove or re-add anything.
     (…/exec?wrap=<this page> tells the MIS to come back here when it reloads, e.g. after Logout.) -->
<style>
  html,body{margin:0;height:100%;background:#f6f7f9;overflow:hidden}
  #mis{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #slow{position:fixed;left:0;right:0;bottom:max(14px,env(safe-area-inset-bottom));text-align:center;font:600 13px 'Segoe UI',Roboto,Arial,sans-serif;display:none;z-index:2}
  #slow a{background:#fff;color:#DA1017;text-decoration:none;padding:9px 14px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.15)}
</style>
</head>
<body>
<iframe id="mis" title="Nakoda MIS" credentialless allow="geolocation *; camera *; microphone *; clipboard-read *; clipboard-write *; fullscreen *; web-share *"></iframe>
<div id="slow"><a id="slowA" href="#" target="_blank" rel="noopener">MIS not opening? Tap here</a></div>
<script>
  var NK_MIS = 'https://script.google.com/macros/s/AKfycbyqVSShH6jsBFYCFhZ-BMa2G5V4VDLYepufI_enlKWutLsi9Jigzo_EmSKSfbj7pO4/exec';
  /* old offline cache of the GitHub MIS must go */
  try{ if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function(r){ r.forEach(function(x){ x.unregister(); }); }); }catch(e){}
  try{ if(window.caches) caches.keys().then(function(k){ k.forEach(function(n){ caches.delete(n); }); }); }catch(e){}
  var here = location.origin + location.pathname;
  document.getElementById('mis').src = NK_MIS + '?wrap=' + encodeURIComponent(here) + (location.hash || '');
  document.getElementById('slowA').href = NK_MIS + (location.hash || '');
  /* safety: if the MIS frame never loads, offer to open it directly after 12 s */
  var loaded = false; document.getElementById('mis').onload = function(){ loaded = true; document.getElementById('slow').style.display = 'none'; };
  setTimeout(function(){ if(!loaded) document.getElementById('slow').style.display = 'block'; }, 12000);
  /* v459d: keep the MIS login for the credentialless frame (it forgets its own storage) */
  var KEY = 'nk_mis_login', sent = false, reloaded = false;
  window.addEventListener('message', function(ev){
    if(!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/i.test(ev.origin) || !ev.data) return;
    var d = ev.data, saved = {};
    try{ saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){}
    if(d.nk === 'hello'){ try{ ev.source.postMessage({nk:'tok', tok:sent ? '' : (saved.tok || ''), uid:saved.uid || ''}, ev.origin); }catch(e){} sent = true; }
    else if(d.nk === 'save'){ try{ d.tok ? localStorage.setItem(KEY, JSON.stringify({tok:String(d.tok), uid:String(d.uid || '')})) : localStorage.removeItem(KEY); }catch(e){} }
    else if(d.nk === 'reload' && !reloaded){ reloaded = true; var f = document.getElementById('mis'); f.src = NK_MIS + '?wrap=' + encodeURIComponent(here) + '&r=1' + (location.hash || ''); }
  });
  /* #crmcard=… links arriving while the page is open */
  window.addEventListener('hashchange', function(){ document.getElementById('mis').src = NK_MIS + '?wrap=' + encodeURIComponent(here) + (location.hash || ''); });
</script>
</body>
</html>
